<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="emoji">🎁</div>

        <h1>Hey, You! 👀</h1>

        <p>
            I made a little surprise for you...
        </p>

        <button onclick="openSurprise()">
            Open Surprise ✨
        </button>

        <div id="message">

            <div class="cake">
                <div class="candle">
                   <div class="flame">🔥</div>
                </div>

                <div class="cake-top"></div>
                <div class="cake-body"></div>
            </div>

            <h2>🎂 Happy Birthday,sakshi(DORAEMON) 🎉</h2>
            <p>
                May your day be filled with happiness,
                laughter and beautiful memories. ❤️
            </p>
        </div>

        <div class="gift" onclick="openGift()">
         🎁
        </div>
        <p id="secretMessage">
           You are a really special friend. ❤️✨
        </p>

        <div id="letter">

            <div class="letter-paper">

              <h2>💌 A Little Message For You</h2>

              <p id="typingText"></p>

             </div>

       </div>

    </div>

    <script src="script.js"></script>

<div class="balloons">
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
    <span>🎈</span>
</div>


</body>
</html>
